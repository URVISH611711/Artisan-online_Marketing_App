version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: artisan_ai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-611711}
      POSTGRES_DB: artisan_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optionally mount the schema.sql to initialize it automatically on first run
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    container_name: artisan_ai_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-611711}@db:5432/artisan_ai
      - SECRET_KEY=${SECRET_KEY:-94b281f96409893d56b0d91244e88390b1e4cf22}
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  postgres_data:
